<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182642"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="bloque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- suelo -->
  <rect x="6" y="52" width="52" height="2.6" rx="1.3" fill="#64748b"/>

  <!-- pared de anclaje -->
  <rect x="9" y="21" width="5.6" height="31" rx="1.6" fill="#334155" stroke="#475569" stroke-width="0.6"/>
  <rect x="14.6" y="21" width="1.2" height="31" fill="#94a3b8" opacity="0.55"/>

  <!-- muelle -->
  <polyline points="15.8,36.5 18.5,29.5 22.5,43.5 26.5,29.5 30.5,43.5 34.5,29.5 38,36.5"
            fill="none" stroke="#c4d0e0" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bloque -->
  <rect x="38" y="25.5" width="15.5" height="26.5" rx="3.6" fill="url(#bloque)" stroke="#bae6fd" stroke-width="1.2"/>
  <rect x="40.2" y="27.6" width="11.1" height="4.6" rx="1.8" fill="#ffffff" opacity="0.2"/>

  <!-- flecha de fuerza -->
  <line x1="41.5" y1="18.5" x2="52.5" y2="18.5" stroke="#f472b6" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="55.5,18.5 51.2,15.8 51.2,21.2" fill="#f472b6"/>
</svg>
